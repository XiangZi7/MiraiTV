# Nuxt 项目根目录为 web；名称须与 Cloudflare Pages 项目一致。
name = "miraitv"
pages_build_output_dir = "./dist"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# 非敏感运行参数；NUXT_API_KEY 使用 Pages secret 配置。
[vars]
NUXT_API_BASE = "https://tvapi.yxcr.top/api/v1"
NUXT_PUBLIC_SITE_URL = "https://tv.yxcr.top"

# Pages 的 vars 不会自动继承到预览环境。
[env.preview.vars]
NUXT_API_BASE = "https://tvapi.yxcr.top/api/v1"
NUXT_PUBLIC_SITE_URL = "https://tv.yxcr.top"
