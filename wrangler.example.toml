# 复制为 wrangler.toml（由 Git 忽略），填写自己的 Pages 项目与域名。
# 此文件是模板，不会自动影响 Cloudflare Git 集成部署。
name = "my-miraitv"
pages_build_output_dir = "./dist"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# 只放非敏感参数。密钥使用 Pages Secrets，不能写在 vars 中。
[vars]
NUXT_API_BASE = "https://api.example.com/api/v1"
NUXT_AUTH_COOKIE_SECURE = "true"
NUXT_REDIRECT_HOSTS = ""
NUXT_PUBLIC_SITE_URL = "https://tv.example.com"
NUXT_PUBLIC_GA_ID = ""

# 预览环境独立配置，默认不启用统计；后端应使用自己的测试环境。
[env.preview.vars]
NUXT_API_BASE = "https://api-preview.example.com/api/v1"
NUXT_AUTH_COOKIE_SECURE = "true"
NUXT_REDIRECT_HOSTS = ""
NUXT_PUBLIC_SITE_URL = "https://preview.example.com"
NUXT_PUBLIC_GA_ID = ""
