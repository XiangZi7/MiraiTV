<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyalite 0.1.0 · 原版与 MiraiTV 对照</title>
  <link rel="stylesheet" href="/glass.css">
  <script src="/reference.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; color: #f2efe6; background: #101a2b; font: 14px/1.45 system-ui, sans-serif; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .intro { color: #b3c2d9; margin-bottom: 28px; }
    .comparison { display: flex; flex-wrap: wrap; gap: 24px; }
    figure { margin: 0; }
    figcaption { padding: 12px 0; color: #b3c2d9; }
    .scene { position: relative; width: 398px; height: 201px; background: repeating-linear-gradient(45deg,#101a2b 0 14px,#2b3d5c 14px 28px); }
    .orb { position: absolute; top: 26px; left: 249px; width: 134px; height: 140px; border-radius: 50%; background: #06d6a0; }
    .card { position: absolute; top: 36px; left: 34px; width: 340px; height: 129px; border-radius: 30px; padding: 22px 24px 20px; }
    /* Keep the screenshot finish only in this exact-reference comparison. */
    .card.glass-surface { --glass-tint:rgba(0,0,0,.13); --glass-border:rgba(255,255,255,.10); --glass-shadow:0 16px 42px rgba(0,0,0,.36); }
    .reference { background: rgba(0,0,0,.13); border: 1px solid rgba(255,255,255,.10); box-shadow:0 16px 42px rgba(0,0,0,.36),inset 0 .5px 0 rgba(255,255,255,.42),inset 0 -.5px 0 rgba(255,255,255,.14),inset 3px 0 9px -6px rgba(255,255,255,.42),inset -3px 0 9px -6px rgba(255,255,255,.42); backdrop-filter:var(--hyalite-010,blur(3px)); }
    .card h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
    .card p { margin: 0; font-size: 12.5px; line-height: 1.5; opacity: .8; }
    .sig { position:absolute; right:20px; bottom:7px; font:9.5px/1 ui-monospace,monospace; letter-spacing:.06em; color:#ffffff6b; }
    .label { position:absolute; top:175px; width:100%; text-align:center; font:12px/1.4 ui-monospace,monospace; color:#ffffffc7; }
    #results { padding-left: 20px; line-height: 1.9; }
    .pass { color: #73e5bc; } .fail { color: #ff8398; }
    .probe-bed { position: relative; min-height: 260px; margin-top: 20px; padding: 24px; background: repeating-linear-gradient(45deg,#101a2b 0 14px,#2b3d5c 14px 28px); overflow: hidden; }
    #large { width: 100%; min-width: 850px; height: 160px; padding: 32px; }
    #probes { display: flex; gap: 20px; margin-top: 28px; }
    .probe { width: 96px; height: 96px; border-radius: 50%; }
    #probes { position:fixed; right:16px; bottom:16px; z-index:2; }
    @media(max-width:500px) { body { padding: 12px; } .comparison { zoom: .85; } }
  </style>
</head>
<body>
  <h1>同一块玻璃，同一个折射公式。</h1>
  <p class="intro">Hyalite 0.1.0 · 25px bevel / 10px thickness / 0.5px blur / 0.09 dispersion / 0.3 rim</p>
  <div class="comparison">
    <figure><div class="scene"><div class="orb"></div><article id="reference" class="reference card"><h3>0.1.0</h3><p>Refraction arrives: an SDF per element, Snell for the offsets, a no-fold cap. Shown at a 25px bevel over 10px of glass.</p><i class="sig">hyalite · VII-Cae (VII)</i></article><div class="label">0.1.0 · it bends</div></div><figcaption>上游原版</figcaption></figure>
    <figure><div class="scene"><div class="orb"></div><article id="integrated" class="glass-surface glass-refract card"><h3>0.1.0</h3><p>Refraction arrives: an SDF per element, Snell for the offsets, a no-fold cap. Shown at a 25px bevel over 10px of glass.</p><i class="sig">hyalite · VII-Cae (VII)</i></article><div class="label">0.1.0 · it bends</div></div><figcaption>MiraiTV 实际引擎与样式</figcaption></figure>
  </div>
  <ul id="results" aria-label="验证结果"></ul>
  <div class="probe-bed"><div id="large" class="glass-surface glass-refract">超过 800px 的面板也使用真实折射</div><div id="probes"><div class="probe glass-surface glass-refract"></div><div class="probe reference"></div></div></div>
  <script type="module">
    import { Hyalite, HYALITE_PRESET, watchLiquidGlass } from '/index.js'
    const results = document.querySelector('#results')
    const report = (message, ok) => { const li = document.createElement('li'); li.textContent = `${ok ? 'PASS' : 'FAIL'} · ${message}`; li.className = ok ? 'pass' : 'fail'; results.append(li); if (!ok) throw new Error(message); }
    const next = () => new Promise(resolve => requestAnimationFrame(resolve))
    async function until(check) { for (let i=0;i<240;i++) { if(check()) return; await next(); } throw new Error('Timed out'); }
    const filter = el => { const id = el.style.getPropertyValue('--hyalite-010').match(/#([^)]*)/)?.[1]; return id ? document.getElementById(id) : null; }
    const graph = el => { const f=filter(el)?.cloneNode(true); f?.removeAttribute('id'); return f?.outerHTML; }
    let canvasCount = 0, referenceBuild = false, scratch
    const createElement = document.createElement.bind(document)
    document.createElement = (...args) => {
      const element = createElement(...args)
      if (args[0] === 'canvas' && !referenceBuild) { canvasCount++; scratch = element }
      return element
    }
    const attachReference = el => { referenceBuild=true; try { Hyalite010.attach(el, HYALITE_PRESET) } finally { referenceBuild=false } }
    const watcher = watchLiquidGlass()
    const secondWatcher = watchLiquidGlass()
    const ref = document.querySelector('#reference'), integrated = document.querySelector('#integrated')
    try {
      report('Chromium 支持 SVG 背景折射', Hyalite.supported())
      attachReference(ref)
      await until(() => filter(integrated))
      report('截图尺寸下的位移 PNG 与上游逐字节一致', filter(ref).querySelector('feImage').getAttribute('href') === filter(integrated).querySelector('feImage').getAttribute('href'))
      report('完整 SVG 滤镜图与上游一致', graph(ref) === graph(integrated))
      const a=getComputedStyle(ref), b=getComputedStyle(integrated)
      report('参考模式的底色、边框、圆角与阴影一致', a.backgroundColor===getComputedStyle(integrated,'::before').backgroundColor && ['borderTopColor','borderTopWidth','borderRadius','boxShadow'].every(k=>a[k]===b[k]))
      report('内容容器不再建立嵌套 backdrop-filter 根', b.backdropFilter==='none' && getComputedStyle(integrated,'::before').backdropFilter.includes('url('))
      const large=document.querySelector('#large')
      await until(()=>filter(large))
      report('大于 800px 的面板拥有独立折射图', large.offsetWidth>800 && !!filter(large))
      const circle=document.querySelector('.probe.glass-surface'), circleRef=document.querySelector('.probe.reference')
      attachReference(circleRef)
      await until(()=>filter(circle))
      report('圆形按钮的位移图与上游一致', graph(circle)===graph(circleRef))
      const added=document.createElement('div'); added.className='probe glass-surface glass-refract'; added.style.cssText='position:fixed;right:16px;bottom:16px;z-index:2'; document.querySelector('#probes').append(added)
      await until(()=>filter(added)); report('动态插入的弹层自动接入',!!filter(added))
      const old=filter(added); added.style.width='144px'
      await until(()=>filter(added)!==old); report('尺寸变化后重建折射图',filter(added).getAttribute('width')==='144')
      added.classList.remove('glass-surface'); await until(()=>!filter(added)); report('移除玻璃样式后释放滤镜',!filter(added))
      added.classList.add('glass-surface'); await until(()=>filter(added))
      document.querySelector('#probes').prepend(added); await next(); await next(); report('移动节点后仍保留折射',!!filter(added))
      added.style.transform='translateY(10000px)'; await until(()=>!filter(added)); report('离屏表面释放折射资源',!filter(added))
      added.style.transform='none'; await until(()=>filter(added)); report('重新进入视口时恢复折射',!!filter(added))
      added.remove(); await until(()=>!filter(added)); report('关闭弹层后释放滤镜',!filter(added))
      report('不同尺寸与多次挂载始终只创建一个离屏 canvas',canvasCount===1 && !scratch.isConnected)
      const before=filter(integrated)
      integrated.classList.add('is-selected'); await next(); await next()
      report('普通选中态变化不重建位移图',filter(integrated)===before)
      const dense=document.createElement('div'); dense.style.cssText='position:fixed;top:0;left:0;display:flex;width:300px;flex-wrap:wrap'
      for(let i=0;i<100;i++) { const card=document.createElement('div'); card.className='glass-surface'; card.style.cssText='width:30px;height:30px'; dense.append(card) }
      const count=document.querySelectorAll('filter[id^="hyalite010-"]').length
      document.body.append(dense); await next(); await next(); await next()
      report('增加 100 张普通卡片不增加滤镜或 canvas',document.querySelectorAll('filter[id^="hyalite010-"]').length===count && canvasCount===1 && [...dense.children].every(el=>!filter(el) && getComputedStyle(el,'::before').backdropFilter==='none'))
      dense.remove(); watcher.stop(); watcher.stop()
      report('重复初始化共用管理器，一个调用方退出不影响另一个',filter(integrated)===before)
      secondWatcher.stop()
      report('最后一个调用方退出后清理全部滤镜与 canvas 像素缓冲',document.querySelectorAll('filter[id^="hyalite010-"]').length===0 && scratch.width===1 && scratch.height===1)
      const restarted=watchLiquidGlass(); await until(()=>filter(integrated))
      report('重新启动仍复用同一个 canvas',canvasCount===1)
      const ready = document.createElement('p'); ready.id='complete'; ready.textContent='全部验证通过'; ready.className='pass'; results.after(ready)
    } catch(error) { const li=document.createElement('li'); li.className='fail'; li.textContent=error.message; results.append(li); }
    finally { document.createElement=createElement }
  </script>
</body>
</html>
